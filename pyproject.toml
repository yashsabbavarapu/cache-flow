[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cache-flow"
version = "0.1.0"
description = "Semantic vector cache and cost-aware model router for LLM applications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6","pytest>=8.0", "mypy>=1.9", "uvicorn>=0.29"]

[project.scripts]
cacheflow = "cacheflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cacheflow"]

[tool.mypy]
# No python_version pin: CI runs a 3.11/3.12/3.13 matrix, so mypy should
# check against the interpreter actually running it. Pinning 3.11 makes
# mypy reject 3.12+ syntax inside third-party stubs (e.g. numpy).
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
